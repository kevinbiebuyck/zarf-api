replicaCount: 1

image:
  repository: ghcr.io/kevinbiebuyck/zarf-api
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

# ui serves the embedded web UI (package upload/manage, deployments, jobs)
# at /ui/. Disable to expose only the JSON API.
ui:
  enabled: true
  # customColumns allows defining extra columns for the Installed tab.
  # They read from the raw JSON state via dot-path (e.g. data.metadata.name).
  # customColumns:
  #   - header: "Registry"
  #     path: "connectStrings.registry-domain"

# basePath serves the API and UI under a URL prefix, for deployments behind
# a reverse proxy / APIM that routes on a path prefix (the proxy must
# forward the prefix unstripped). Health probes stay at the root.
# Example: "/zarf-api" -> UI at /zarf-api/ui/, API at /zarf-api/api/v1/...
basePath: ""

# The API is meant to run behind an APIM/gateway that enforces authn/authz.
# The server itself performs no authentication.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: zarf-api.local
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []

persistence:
  enabled: true
  # storageClass: "fast-ssd"
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  # existingClaim: "my-pvc"

rbac:
  # Zarf deploys arbitrary resources (namespaces, CRDs, cluster roles,
  # admission webhooks, ...) on behalf of the packages it installs, so the
  # practical default is cluster-admin. Set to false to supply your own
  # (narrower) rule set via extraRules.
  clusterAdmin: true
  # extraRules are used to build a dedicated ClusterRole when
  # clusterAdmin=false. You are responsible for granting everything your
  # packages need (including zarf state management in the zarf namespace).
  extraRules: []
  #  - apiGroups: [""]
  #    resources: ["secrets", "configmaps", "namespaces"]
  #    verbs: ["*"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false # package actions may write scratch files
  capabilities:
    drop:
      - ALL

# Extra environment variables, e.g.:
# env:
#   ZARF_API_LOG_LEVEL: debug
#   ZARF_API_PUBLIC_KEY_PATH: /keys/cosign.pub
env: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
